<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Sử dụng CSS</title>
    <style>
        /* Định dạng chung cho thẻ h1 */
        h1 {
            color: blue;
            font-family: Tahoma, sans-serif;
            font-size: 200%;
        }

        /* Định dạng chung cho tất cả các thẻ p */
        p {
            color: red;
            font-family: Arial, sans-serif;
            font-size: 120%;
            border: 1px solid grey;
            padding: 10px;
            margin-bottom: 10px;
        }

        /* Định dạng riêng cho phần tử có id là element1 (độ ưu tiên cao hơn) */
        #element1 {
            color: blue;
        }
    </style>
</head>
<body>

    <h1>Đây là đề mục</h1>

    <p>Đây là đoạn văn bản 1.</p>
    <p>Đây là đoạn văn bản 2.</p>
    <p>Đây là đoạn văn bản 3.</p>
    
    <!-- Đoạn văn bản có thuộc tính ID -->
    <p id="element1">Đoạn văn bản có thuộc tính id</p>

</body>
</html>
